<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo de sensores</title>
<style>
  :root {
    --fondo: #e9eef2;
    --panel: #ffffff;
    --texto: #1c2a33;
    --suave: #6b7c88;
    --normal: #dcf1e4;
    --normal-borde: #2e8b57;
    --alerta: #fde3df;
    --alerta-borde: #d64534;
    --barra: #1f3a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #10181d;
      --panel: #18232a;
      --texto: #e6edf1;
      --suave: #8fa1ad;
      --normal: #1d3a2b;
      --alerta: #4a2420;
      --barra: #0b1216;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fondo);
    color: var(--texto);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
  }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: auto; }
    .chat { height: 70vh; }
  }
  .chat {
    background: var(--panel);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .chat header {
    background: var(--barra);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat header h2 { margin: 0; font-size: 1rem; font-weight: 600; }
  .contador { font-size: .85rem; opacity: .85; }
  .mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px 12px 12px 2px;
    border-left: 4px solid var(--normal-borde);
    background: var(--normal);
    font-size: .92rem;
    line-height: 1.4;
    animation: entra .25s ease-out;
  }
  .msg.alerta {
    background: var(--alerta);
    border-left-color: var(--alerta-borde);
  }
  .msg .hora { display: block; font-size: .75rem; color: var(--suave); margin-bottom: 2px; }
  .msg .estado { font-weight: 700; margin-top: 2px; display: block; }
  .msg.alerta .estado { color: var(--alerta-borde); }
  .vacio { margin: auto; color: var(--suave); text-align: center; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
</style>
</head>
<body>

  <section class="chat" aria-label="Chat de datos">
    <header><h2>Datos del sensor</h2><span class="contador" id="cuenta-datos">0 mensajes</span></header>
    <div class="mensajes" id="chat-datos"><p class="vacio">Esperando datos…</p></div>
  </section>

  <section class="chat" aria-label="Chat de alertas">
    <header><h2>Alertas</h2><span class="contador" id="cuenta-alertas">0 alertas</span></header>
    <div class="mensajes" id="chat-alertas"><p class="vacio">Sin alertas por ahora.</p></div>
  </section>

<script>
const INTERVALO_MS = 2000;

function crearMensaje(d) {
  const esAlerta = d.alerta !== "NORMAL";
  const div = document.createElement("div");
  div.className = "msg" + (esAlerta ? " alerta" : "");
  div.innerHTML =
    `<span class="hora">${d.hora ?? ""}</span>` +
    `Temperatura: <b>${d.temperatura}</b> °C · Ruido: <b>${d.ruido}</b> dB · Vibración: <b>${d.vibracion}</b>` +
    `<span class="estado">${d.alerta}</span>`;
  return div;
}

// Solo agrega los mensajes nuevos, para que el chat no se reinicie ni salte
function crearChat(idContenedor, idCuenta, textoUnidad) {
  const cont = document.getElementById(idContenedor);
  const cuenta = document.getElementById(idCuenta);
  let ultimo = "";   // firma del último registro dibujado

  const firma = d => [d.hora, d.temperatura, d.ruido, d.vibracion].join("|");

  return function actualizar(lista) {
    if (!lista.length) return;

    // ¿dónde quedamos? buscamos el último registro ya dibujado
    let inicio = 0;
    if (ultimo) {
      const i = lista.map(firma).lastIndexOf(ultimo);
      inicio = i === -1 ? 0 : i + 1;
      if (i === -1) cont.innerHTML = "";   // el archivo cambió por completo
    }
    const nuevos = lista.slice(inicio);
    if (!nuevos.length) return;

    const vacio = cont.querySelector(".vacio");
    if (vacio) vacio.remove();

    const abajo = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 60;
    nuevos.forEach(d => cont.appendChild(crearMensaje(d)));
    while (cont.children.length > 200) cont.removeChild(cont.firstChild);

    ultimo = firma(lista[lista.length - 1]);
    cuenta.textContent = `${lista.length} ${textoUnidad}`;
    if (abajo) cont.scrollTop = cont.scrollHeight;   // baja solo si ya estabas al final
  };
}

const actualizarDatos = crearChat("chat-datos", "cuenta-datos", "mensajes");
const actualizarAlertas = crearChat("chat-alertas", "cuenta-alertas", "alertas");

async function leer(ruta) {
  const r = await fetch(ruta + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(ruta);
  return r.json();
}

async function ciclo() {
  try { actualizarDatos(await leer("datos.json")); } catch (e) {}
  try { actualizarAlertas(await leer("alertas.json")); } catch (e) {}
}

ciclo();
setInterval(ciclo, INTERVALO_MS);
</script>
</body>
</html>
